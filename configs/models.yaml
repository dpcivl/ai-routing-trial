# =============================================================================
# 모델 설정 파일
# -----------------------------------------------------------------------------
# 코드를 고치지 않고 "어떤 역할에 어떤 모델을 쓸지"를 바꾸기 위한 파일입니다.
# 임베디드에서 보드별 설정을 헤더 파일이나 Kconfig로 분리하는 것과 같은 목적입니다.
#
# 모델 이름은 Ollama 태그 형식(<모델명>:<크기>)입니다.
# 사용 전에 `ollama pull <모델명>`으로 내려받아 두어야 합니다.
# =============================================================================

backend:
  # Ollama와 vLLM 모두 "OpenAI 호환 API"를 제공합니다.
  # 그래서 나중에 회사에서 vLLM으로 옮길 때는 이 주소만 바꾸면 됩니다.
  #   - Ollama: http://localhost:11434/v1
  #   - vLLM  : http://<서버주소>:8000/v1
  base_url: "http://localhost:11434/v1"
  # Ollama는 키를 검사하지 않지만 OpenAI SDK가 빈 값을 허용하지 않아 아무 문자열이나 넣습니다.
  api_key: "ollama"
  # 요청 하나에 기다리는 최대 시간(초). 모델을 처음 메모리에 올릴 때 시간이 걸리므로 넉넉하게 잡습니다.
  timeout_sec: 300

# 라우터가 판단을 못 했을 때(확신이 낮을 때) 보낼 기본 카테고리
default_category: reasoning

# 카테고리별 모델. 키 이름(reasoning / coding / vision)은 코드의 Category와 일치해야 합니다.
#
# [로컬 조합 2026-09-19] 16GB 맥북에서 모델 하나에 쓸 수 있는 메모리는 약 10GB 안팎입니다(추정).
# 그래서 로컬에서는 모델 파일이 ~10GB 이하인 것만 씁니다.
# 회사 vLLM 서버에서는 아래 "회사(vLLM)용" 주석의 모델로 바꿔서 같은 평가셋으로 비교합니다.

# 라우터용 소형 LLM 분류기. `--router llm` 일 때 "이 프롬프트는 어느 카테고리?"를 판단합니다.
# 답변 모델이 아니라 판단 전용이므로 작고 빠른 모델을 씁니다.
router_llm:
  name: "qwen3.5:2b"             # 2.7GB. 후보 비교: "qwen3.5:0.8b"(1.0GB, 더 빠름), "ministral-3:3b"(3.0GB, 다른 계열)
  temperature: 0.0               # 분류는 매번 같은 답이 나와야 하므로 0 (무작위성 제거)
  max_tokens: 32                 # 카테고리 단어 하나면 충분합니다. 길게 두면 그만큼 느려집니다.
  extra_body:
    # qwen3.5는 답하기 전에 '생각'을 먼저 하는 모델입니다. 분류에는 불필요하고 느려지므로 끕니다.
    # (Ollama의 OpenAI 호환 API가 지원하는 필드. vLLM으로 옮길 때는 방식이 다를 수 있음)
    reasoning_effort: "none"

# 카테고리별 답변 모델. 키 이름(reasoning / coding / vision)은 코드의 Category와 일치해야 합니다.
models:
  reasoning:
    name: "deepseek-r1:8b"       # 5.2GB. DeepSeek-R1-0528-Qwen3-8B 증류 모델. 답하기 전에 '생각'을 먼저 출력함
    temperature: 0.6             # DeepSeek-R1 권장값(0.5~0.7)
    max_tokens: 4096             # 생각 과정이 길어서 다른 모델보다 넉넉하게
    # 참고: deepseek-r1:14b(9.0GB)는 구형 증류 모델이라 8b(0528판)보다 점수가 낮음 → 쓸 이유 없음
    # 회사(vLLM)용: gpt-oss:20b(14GB)
  coding:
    name: "qwen2.5-coder:7b"     # 4.7GB. 생각 과정이 없어 빠른 코딩 특화 모델
    temperature: 0.2             # 코드는 일관성이 중요하므로 낮게
    max_tokens: 2048
    # 회사(vLLM)용: devstral-small-2 (24B, 15GB, SWE-bench Verified 65.8). 이 맥북 메모리(≈10GB)를 넘어서 로컬에서는 쓰지 않음
    # 비교 후보: gemma4:12b (LiveCodeBench 72.0 공개 점수)
  vision:
    name: "gemma4:12b"           # 7.6GB, 텍스트+이미지, 컨텍스트 256K. MMMU-Pro 69.1
    temperature: 0.4
    max_tokens: 1024
    # 대안: "qwen3.5:9b"(6.6GB), "minicpm-v4.5:8b"(6.1GB, 문서/OCR에 강점)
